<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de Licencias PITZON / TORQO</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #070b14;
      --surface: #0d1424;
      --panel: #111a2c;
      --panel-soft: #15223a;
      --line: #2a3853;
      --text: #edf4ff;
      --muted: #9fb0c9;
      --blue: #38bdf8;
      --green: #34d399;
      --red: #fb7185;
      --shadow: 0 18px 70px #0007;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Segoe UI", Arial, sans-serif;
      background:
        radial-gradient(circle at top left, #193b63 0, #0b1425 36%, var(--bg) 100%);
      color: var(--text);
    }

    button, input, select, textarea { font: inherit; }

    button {
      border: 0;
      border-radius: 14px;
      padding: 11px 16px;
      background: var(--blue);
      color: #07111f;
      font-weight: 800;
      cursor: pointer;
      min-height: 44px;
    }

    button:hover { filter: brightness(1.05); }
    button.red { background: var(--red); color: white; }
    button.green { background: var(--green); color: #062016; }
    button.secondary { background: #25334d; color: var(--text); }

    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: #0a1020;
      color: white;
      padding: 12px 14px;
      outline: none;
    }

    label { display: grid; gap: 8px; color: #dbe8ff; font-weight: 650; }
    h1, h2, h3, p { margin-top: 0; }
    .muted { color: var(--muted); }
    .error { color: #fecdd3; min-height: 24px; margin-bottom: 0; }

    .login {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    .login-card, .panel, .card {
      background: color-mix(in srgb, var(--panel) 92%, transparent);
      border: 1px solid var(--line);
      border-radius: 20px;
      box-shadow: var(--shadow);
    }

    .login-card {
      width: min(430px, 94vw);
      padding: 26px;
    }

    .brand {
      display: flex;
      gap: 14px;
      align-items: center;
      margin-bottom: 22px;
    }

    .mark {
      width: 48px;
      height: 48px;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--blue), var(--green));
      box-shadow: 0 12px 30px #38bdf833;
      flex: 0 0 auto;
    }

    .app { display: none; }

    header {
      position: sticky;
      top: 0;
      z-index: 5;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 18px;
      padding: 20px clamp(16px, 3vw, 34px);
      border-bottom: 1px solid var(--line);
      background: #0b1222e8;
      backdrop-filter: blur(14px);
    }

    header h2 { margin-bottom: 6px; font-size: clamp(22px, 2.2vw, 30px); }

    .wrap {
      padding: 24px clamp(14px, 3vw, 34px) 38px;
      display: grid;
      gap: 18px;
    }

    .toolbar {
      display: grid;
      grid-template-columns: minmax(180px, 240px) minmax(260px, 1fr) auto;
      gap: 14px;
      align-items: end;
      background: color-mix(in srgb, #12233b 70%, transparent);
      border: 1px solid #1f3451;
      border-radius: 20px;
      padding: 16px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, minmax(150px, 1fr));
      gap: 14px;
    }

    .card {
      padding: 18px 20px;
      min-height: 112px;
    }

    .card b {
      display: block;
      margin-top: 10px;
      font-size: 34px;
      line-height: 1;
    }

    .grid {
      display: grid;
      grid-template-columns: minmax(0, 1.35fr) minmax(320px, .65fr);
      gap: 18px;
      align-items: start;
    }

    .panel {
      padding: 22px;
      min-width: 0;
    }

    .table {
      overflow: auto;
      max-height: 64vh;
      border-radius: 14px;
    }

    table {
      width: 100%;
      min-width: 900px;
      border-collapse: collapse;
    }

    th, td {
      border-bottom: 1px solid var(--line);
      padding: 14px 12px;
      text-align: left;
      vertical-align: top;
    }

    th {
      color: #bdd2f0;
      font-size: 12px;
      text-transform: uppercase;
    }

    td small {
      color: #b7c7df;
      overflow-wrap: anywhere;
    }

    .pill {
      display: inline-flex;
      align-items: center;
      min-height: 32px;
      border-radius: 999px;
      padding: 5px 12px;
      font-weight: 800;
    }

    .ok { background: #064e3b; color: #a7f3d0; }
    .off { background: #5f1624; color: #fecdd3; }

    .row-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      min-width: 150px;
    }

    .row-actions button { padding-inline: 14px; }

    .event {
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 14px;
      margin: 10px 0;
      background: #0d1424;
    }

    dialog {
      width: min(540px, calc(100vw - 32px));
      max-height: calc(100vh - 40px);
      border: 1px solid var(--line);
      border-radius: 22px;
      background: var(--panel);
      color: var(--text);
      padding: 0;
      box-shadow: 0 30px 100px #000b;
      overflow: hidden;
    }

    dialog::backdrop { background: #020617b5; }

    .modal {
      width: 100%;
      margin: 0;
      padding: 22px;
      display: grid;
      gap: 16px;
      background: transparent;
      box-shadow: none;
      border: 0;
    }

    .modal textarea {
      min-height: 132px;
      resize: vertical;
      margin: 0;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      justify-content: flex-start;
      flex-wrap: wrap;
    }

    @media (max-width: 980px) {
      .toolbar, .grid { grid-template-columns: 1fr; }
      .cards { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      header { align-items: flex-start; flex-direction: column; }
      header button { width: 100%; max-width: 260px; }
    }

    @media (max-width: 560px) {
      .cards { grid-template-columns: 1fr; }
      .panel, .login-card { padding: 18px; }
      .row-actions button, .modal-actions button { width: 100%; }
    }
  </style>
</head>
<body>
  <section id="login" class="login">
    <form id="loginForm" class="login-card">
      <div class="brand">
        <div class="mark"></div>
        <div>
          <h1>Panel de Licencias</h1>
          <p class="muted">PITZON / TORQO</p>
        </div>
      </div>
      <label>Usuario<input id="username" value="admin" autocomplete="username"></label>
      <label>Contraseña<input id="password" type="password" autocomplete="current-password"></label>
      <button style="width:100%">Entrar</button>
      <p id="err" class="error"></p>
    </form>
  </section>

  <section id="app" class="app">
    <header>
      <div>
        <h2>Administración de aplicaciones</h2>
        <div class="muted">Instalaciones, estado y eventos</div>
      </div>
      <button id="logout" class="secondary">Cerrar sesión</button>
    </header>

    <main class="wrap">
      <section class="toolbar">
        <label>Aplicación
          <select id="appFilter">
            <option value="ALL">Todas</option>
            <option>PITZON</option>
            <option>TORQO</option>
          </select>
        </label>
        <label>Buscar
          <input id="search" placeholder="Equipo, usuario o ID">
        </label>
        <button id="refresh">Actualizar</button>
      </section>

      <section id="cards" class="cards"></section>

      <section class="grid">
        <div class="panel">
          <h2>Instalaciones</h2>
          <div class="table">
            <table>
              <thead>
                <tr>
                  <th>App</th>
                  <th>Equipo</th>
                  <th>Usuario</th>
                  <th>Último uso</th>
                  <th>Usos</th>
                  <th>Estado</th>
                  <th>Acciones</th>
                </tr>
              </thead>
              <tbody id="rows"></tbody>
            </table>
          </div>
        </div>

        <aside class="panel">
          <h2>Eventos</h2>
          <div id="events"></div>
        </aside>
      </section>
    </main>
  </section>

  <dialog id="dlg">
    <form method="dialog" class="modal">
      <h3>Notas</h3>
      <textarea id="notes" placeholder="Escribe una nota para esta instalación"></textarea>
      <div class="modal-actions">
        <button id="saveNotes" type="button">Guardar</button>
        <button class="secondary">Cerrar</button>
      </div>
    </form>
  </dialog>

  <script>
    const API = 'https://fxdkwupfkhgyadrxpifs.supabase.co/functions/v1/licencias-panel';
    let noteId = null;
    let data = [];

    const $ = id => document.getElementById(id);
    const token = () => localStorage.getItem('licensing_token') || '';
    const authHeaders = () => token() ? { Authorization: 'Bearer ' + token() } : {};

    async function api(path, options = {}) {
      const headers = { ...(options.headers || {}), ...authHeaders() };
      const res = await fetch(API + path, { ...options, headers });
      if (res.status === 401) {
        localStorage.removeItem('licensing_token');
        showLogin();
        throw new Error('No autorizado');
      }
      return res;
    }

    function showLogin() {
      login.style.display = 'grid';
      app.style.display = 'none';
    }

    function showApp() {
      login.style.display = 'none';
      app.style.display = 'block';
      load();
    }

    loginForm.onsubmit = async e => {
      e.preventDefault();
      err.textContent = '';
      const res = await fetch(API + '/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: username.value, password: password.value })
      });
      if (!res.ok) {
        err.textContent = 'Credenciales inválidas';
        return;
      }
      const body = await res.json();
      localStorage.setItem('licensing_token', body.token);
      showApp();
    };

    logout.onclick = () => {
      localStorage.removeItem('licensing_token');
      showLogin();
    };

    refresh.onclick = load;
    appFilter.onchange = load;
    search.oninput = debounce(loadRows, 180);
    saveNotes.onclick = async () => {
      await api('/api/installations/' + noteId + '/notes', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ notes: notes.value })
      });
      dlg.close();
      loadRows();
    };

    async function load() {
      await Promise.all([loadSummary(), loadRows(), loadEvents()]);
    }

    async function loadSummary() {
      const source = await api('/api/summary').then(r => r.json());
      const total = source.reduce((a, x) => ({
        i: a.i + x.totalInstallations,
        a: a.a + x.activeInstallations,
        b: a.b + x.inactiveInstallations,
        l: a.l + x.totalLaunches
      }), { i: 0, a: 0, b: 0, l: 0 });

      cards.innerHTML =
        card('Instalaciones', total.i) +
        card('Activas', total.a) +
        card('Bloqueadas', total.b) +
        card('Ejecuciones', total.l);
    }

    async function loadRows() {
      const query = new URLSearchParams({ appCode: appFilter.value, search: search.value });
      data = await api('/api/installations?' + query).then(r => r.json());
      rows.innerHTML = data.map(x =>
        '<tr>' +
        '<td><b>' + esc(x.appCode) + '</b></td>' +
        '<td>' + esc(x.machineName) + '<br><small>' + esc(x.installationId) + '</small></td>' +
        '<td>' + esc(x.windowsUser) + '</td>' +
        '<td>' + dt(x.lastSeenAt) + '</td>' +
        '<td>' + x.launchCount + '</td>' +
        '<td><span class="pill ' + (x.isActive ? 'ok' : 'off') + '">' + (x.isActive ? 'Activa' : 'Bloqueada') + '</span></td>' +
        '<td><div class="row-actions"><button class="' + (x.isActive ? 'red' : 'green') + '" onclick="act(\'' + x.installationId + '\',' + (!x.isActive) + ')">' + (x.isActive ? 'Desactivar' : 'Activar') + '</button><button onclick="openN(\'' + x.installationId + '\')">Notas</button></div></td>' +
        '</tr>'
      ).join('') || '<tr><td colspan="7">Sin instalaciones</td></tr>';
    }

    async function loadEvents() {
      const query = new URLSearchParams({ appCode: appFilter.value });
      const source = await api('/api/events?' + query).then(r => r.json());
      events.innerHTML = source.map(x =>
        '<div class="event"><b>' + esc(x.appCode) + '</b> ' + esc(x.eventType) +
        '<br><small>' + esc(x.machineName) + ' / ' + esc(x.windowsUser) +
        '<br>' + dt(x.eventAt) + '</small></div>'
      ).join('') || 'Sin eventos';
    }

    async function act(id, isActive) {
      await api('/api/installations/' + id + '/activation', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ isActive })
      });
      load();
    }

    function openN(id) {
      noteId = id;
      const row = data.find(x => x.installationId === id);
      notes.value = row?.notes || '';
      dlg.showModal();
    }

    function card(label, value) {
      return '<div class="card"><span class="muted">' + label + '</span><b>' + value + '</b></div>';
    }

    function esc(value) {
      return String(value ?? '').replace(/[&<>'"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[c]));
    }

    function dt(value) {
      return value ? new Date(value).toLocaleString('es-MX') : '-';
    }

    function debounce(fn, ms) {
      let id;
      return () => {
        clearTimeout(id);
        id = setTimeout(fn, ms);
      };
    }

    if (token()) showApp();
  </script>
</body>
</html>
